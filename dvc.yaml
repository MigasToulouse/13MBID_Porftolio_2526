stages:
  # 1er stage: exploración de datos. Gráficos y reporte EDA
  visualize_data:
    cmd: python src\data_visualization_and_EDA.py
    deps:
      - data\raw\bank-additional-full.csv
    outs:
      - docs\figures\
      - docs\reports\EDA_reporte.html
  # 2do stage: test de calidad de datos
  test_data_quality:
    cmd: pytest --html=docs\test_results\test_dataquality_results.html --self-contained-html test\test_dataquality.py
    deps:
      - test\test_dataquality.py
      - data\raw\bank-additional-full.csv
    outs:
      - docs\test_results\test_dataquality_results.html
  # 3er stage: test con great_expectations
  test_data_gx:
    cmd: pytest --html=docs\test_results\test_gx_results.html --self-contained-html test\test_data_gx.py
    deps:
      - test\test_data_gx.py
      - data\raw\bank-additional-full.csv
    outs:
      - docs\test_results\test_gx_results.html
  # 4to stage: preprocesamiento de datos
  preprocess_data:
    cmd: python src\data_preprocessing.py
    deps:
      - src\data_preprocessing.py
      - data\raw\bank-additional-full.csv
    outs:
      - data\processed\bank-additional-full_preprocessed.csv
      - docs\transformaciones_dataset.md
  # 5to stage: entrenamiento del modelo
  train_model:
    cmd: python src\train_model.py
    deps:
        - src\train_model.py
        - data\processed\bank-additional-full_preprocessed.csv
    outs:
      - models\decision_tree_model.pkl
      - models\preprocessor.pkl
      - metrics\model_metrics.json
